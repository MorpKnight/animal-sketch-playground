services:
  playground:
    build:
      context: .
    image: ghcr.io/morpknight/animal-sketch-playground:local
    container_name: animal-sketch-playground
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
